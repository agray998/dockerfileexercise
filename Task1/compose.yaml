services:
  flask-app:
    image: ${dockerhub_USR}/task1-app
    build: .
    networks:
    - task1
  proxy:
    image: nginx
    ports:
    - "80:80"
    networks:
    - task1
    volumes:
    - type: bind
      source: ./nginx.conf
      target: /etc/nginx/nginx.conf
    depends_on:
    - flask-app
networks:
  task1:
